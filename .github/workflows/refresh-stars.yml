name: Refresh stars

# Updates data/stars.json, which sets each project's place on the board.
# The commit it pushes to main makes Cloudflare rebuild the site.
on:
  schedule:
    - cron: '0 18 * * *' # daily, 02:00 Malaysia time
  push:
    branches: [main]
    paths: ['submissions/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stars
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look up star counts
        run: node scripts/refresh-stars.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/stars.json; then
            echo "No change in star counts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/stars.json
          git commit -m "Refresh star counts"
          git push
